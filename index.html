<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LVL - NetAtlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>:root{font-family:Inter,system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e5edf7}header{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0d1a2c;border-bottom:1px solid #20324b}h1{font-size:17px;margin:0;margin-right:auto}.muted,#summary{color:#9fb0c8;font-size:12px}button{border:1px solid #315077;background:#172a45;color:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}button.primary{background:#1570c8}button.danger{background:#8f2430}#map{height:calc(100vh - 64px);background:#0b1625}.device{border:2px solid #22c55e;border-radius:7px;display:grid;place-items:center;background:transparent;filter:drop-shadow(0 2px 3px #000b);overflow:visible}.device img{width:94%;height:92%;object-fit:contain}.down{border-color:#ef4444}.planned{opacity:.72;border-color:#94a3b8;border-style:dashed}.cto{border-color:#38bdf8}.site-cluster{width:25px;height:25px;border:2px solid #38bdf8;border-radius:6px;background:#0d1a2ce8;color:white;display:grid;place-items:center;font:bold 11px system-ui;box-shadow:0 2px 7px #0008}.leaflet-popup-content-wrapper,.leaflet-popup-tip{color:#172033}.modal{position:fixed;inset:0;background:#0009;z-index:2000;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:min(620px,92vw);max-height:80vh;overflow:auto;background:#101d31;border:1px solid #304763;border-radius:12px;padding:18px}.box h2{margin:0 0 10px;font-size:18px}.iface{display:block;width:100%;text-align:left;margin:6px 0;background:#172a45}.iface small{color:#afbed1}.updot{color:#22c55e}.downdot{color:#ef4444}.unkdot{color:#f59e0b}input,select{width:100%;padding:9px;margin:6px 0 12px;background:#091526;color:#fff;border:1px solid #38506f;border-radius:6px}.hint{position:fixed;z-index:1000;left:50%;top:76px;transform:translateX(-50%);background:#0d1a2cee;border:1px solid #4b6688;padding:9px 14px;border-radius:8px;display:none}.legend{background:#0d1a2cee;padding:8px;border-radius:6px;font-size:12px}.line-swatch{display:inline-block;width:22px;border-top:4px solid;margin-right:5px}#panel{position:fixed;z-index:1500;right:0;top:64px;width:min(390px,92vw);height:calc(100vh - 64px);background:#0d1a2cf5;border-left:1px solid #304763;padding:18px;overflow:auto;transform:translateX(102%);transition:.2s}#panel.show{transform:none}#panel h2{font-size:18px;margin:0 35px 5px 0}#panelClose{position:absolute;right:12px;top:10px;background:transparent;font-size:20px}.panel-meta{color:#9fb0c8;font-size:12px;margin-bottom:14px}.panel-iface{border:1px solid #304763;border-radius:8px;padding:9px;margin:7px 0;cursor:pointer;background:#14243b}.panel-iface.selected{border-color:#38bdf8;background:#173455}.panel-action{width:100%;margin-top:12px;background:#1570c8}</style></head>
<style>.marker-wrap{position:relative}.device{position:relative!important;display:block!important;overflow:hidden!important;border:0!important;border-radius:0!important;filter:drop-shadow(0 1px 2px #16a34a)!important}.device.down{filter:drop-shadow(0 1px 3px #ef4444)!important}.device.planned{filter:drop-shadow(0 1px 2px #94a3b8)!important}.device img{position:absolute!important;inset:3%!important;display:block!important;width:94%!important;height:94%!important;max-width:94%!important;max-height:94%!important;object-fit:contain!important}.device-label{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;background:#0d1a2cdd;color:#fff;font:600 10px system-ui;padding:2px 4px;border-radius:3px;text-shadow:0 1px 2px #000;pointer-events:none}.iface-metrics{display:grid;grid-template-columns:1fr;gap:6px;margin-top:9px}.iface-metrics>div{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px;background:#091526;border:1px solid #263b57;border-radius:6px}.iface-metrics span{color:#9fb0c8;font-size:11px}.iface-metrics b{font-size:13px}.iface-metrics small{grid-column:1/-1;color:#71839b}.link-side{margin:10px 0;padding:10px;border:1px solid #304763;border-radius:8px;background:#14243b}.link-side h3{font-size:14px;margin:0 0 7px}.link-side p{margin:5px 0}</style>
<body><header><h1>LVL - NetAtlas</h1><span id="summary">Carregando…</span><button id="newHost">Adicionar Host</button><button id="newCto">Adicionar CTO</button><button id="undo" style="display:none">↶ Voltar ponto</button><button id="cancel" class="danger" style="display:none">Cancelar</button></header><div id="hint" class="hint"></div><main id="map"></main><aside id="panel"><button id="panelClose">×</button><div id="panelBody"></div></aside>
<div id="modal" class="modal"><div class="box"><h2 id="modalTitle"></h2><div id="modalBody"></div><button onclick="closeModal()">Cancelar</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
const map=L.map('map').setView([-4.88,-43.34],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markers=new Map(),editable=new L.FeatureGroup().addTo(map),siteMarkers=[];let mode=null,draft=null,preview=null,links=[],movingMarker=null;
map.addControl(new L.Control.Draw({position:'topleft',draw:false,edit:{featureGroup:editable,remove:true}}));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iconUrl(d){let n=`${d.name} ${d.model||''} ${d.manufacturer||''}`.toLowerCase();if(d.kind==='cto')return'/static/icons/cto.svg?v=20260929';if(d.kind==='cloud')return'/static/icons/cloud.svg';if(d.kind==='host')return'/static/icons/switch-huawei.png';if(d.role_slug==='router'||n.includes('ne-8000')||n.includes('ne8000'))return'/static/icons/ne8000.png';if(n.includes('vsol')||n.includes('v-sol'))return'/static/icons/olt-vsol.png';if(n.includes('phyhome')||n.includes('phyome'))return'/static/icons/olt-phyhome.png';if(d.role_slug==='switch')return'/static/icons/switch-huawei.png';return'/static/icons/olt-huawei.png'}
function markerSize(d){let z=map.getZoom();if(d.kind==='cto')return z>=19?[30,30]:z>=17?[26,26]:[21,21];if(d.kind==='cloud')return z>=17?[44,32]:[36,27];return z<=12?[28,21]:z===13?[36,27]:z===14?[48,35]:[62,45]}
function mkIcon(d){let s=markerSize(d),cls=`device ${d.kind==='cto'?'cto':d.kind==='cloud'?'cloud':''} ${d.down?'down':''} ${d.planned?'planned':''}`;return L.divIcon({className:'',iconSize:[s[0],s[1]+16],iconAnchor:[s[0]/2,s[1]/2],html:`<div class="marker-wrap" style="width:${s[0]}px;height:${s[1]}px"><div class="${cls}" style="width:${s[0]}px;height:${s[1]}px"><img src="${iconUrl(d)}"></div><span class="device-label">${esc(d.name)}</span></div>`})}
function offset(lat,lng,i,n){if(n<2)return[lat,lng];let a=2*Math.PI*i/n-Math.PI/2,r=Math.min(22,8+n*2.5);return[lat+r/111320*Math.sin(a),lng+r/(111320*Math.cos(lat*Math.PI/180))*Math.cos(a)]}
function endpoint(d){return{kind:d.kind==='device'?'device':'node',id:d.id,name:d.name,zabbix_hostid:d.zabbix_hostid||null,interface_itemid:null,interface_name:null,interface_description:null}}
function addMarker(d,point){let m=L.marker(point,{icon:mkIcon(d),title:d.name}).addTo(map);m.net=d;m.anchor=point;m.on('click',e=>{L.DomEvent.stopPropagation(e);if(mode==='route'||mode==='target')chooseMarker(m);else if(!mode)openHostPanel(m)});m.on('contextmenu',e=>{L.DomEvent.stopPropagation(e);if(mode)return;let p=L.popup().setLatLng(e.latlng).setContent('<button id="moveElement">Mover</button>').openOn(map);setTimeout(()=>{let b=document.getElementById('moveElement');if(b)b.onclick=()=>{map.closePopup(p);startMove(m)}},0)});markers.set(`${d.kind}:${d.id}`,m);return m}
function startMove(m){mode='moving';movingMarker=m;closePanel();m.dragging.enable();hint(`Arraste ${m.net.name} para a nova posição.`);document.getElementById('cancel').style.display='inline-block';m.once('dragend',async()=>{let p=m.getLatLng(),kind=m.net.kind==='device'?'device':'node';try{await api(`/api/elements/${kind}/${m.net.id}/position`,{method:'PUT',body:JSON.stringify({latitude:p.lat,longitude:p.lng})});m.anchor=[p.lat,p.lng];m.dragging.disable();movingMarker=null;mode=null;hint('');document.getElementById('cancel').style.display='none';await loadLinks()}catch(e){m.setLatLng(m.anchor);m.dragging.disable();movingMarker=null;mode=null;hint('');alert(e.message)}})}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.detail||r.statusText)}return r.status===204?null:r.json()}
function hint(t){let h=document.getElementById('hint');h.textContent=t;h.style.display=t?'block':'none'}function closeModal(){document.getElementById('modal').classList.remove('show')}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
async function selectInterface(d,side){if(!d.zabbix_hostid)return endpoint(d);let xs=await api(`/api/interfaces/${d.zabbix_hostid}`);return new Promise(resolve=>{modal(`Interface ${side} — ${d.name}`,xs.length?xs.map((x,i)=>`<button class="iface" data-i="${i}"><b class="${x.status==='up'?'updot':x.status==='down'?'downdot':'unkdot'}">●</b> ${esc(x.name)}<br><small>${esc(x.description||'Sem descrição')} · ${x.status}</small></button>`).join(''):'<p>Nenhuma interface encontrada no Zabbix.</p>');document.querySelectorAll('.iface').forEach(b=>b.onclick=()=>{let x=xs[+b.dataset.i],e=endpoint(d);e.interface_itemid=x.status_itemid;e.interface_name=x.name;e.interface_description=x.description;closeModal();resolve(e)})})}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function showPanel(html){document.getElementById('panelBody').innerHTML=html;document.getElementById('panel').classList.add('show')}
async function beginLink(m,selected){let splitter=m.net.kind==='cto'?await splitterForm(m.net.name,'origem'):null;if(m.net.kind==='cto'&&splitter===undefined)return;let choices=Array.isArray(selected)?selected:[selected],sources=choices.map(x=>{let ep=endpoint(m.net);if(x){ep.interface_itemid=x.status_itemid;ep.interface_name=x.name;ep.interface_description=x.description}if(m.net.kind==='cto')ep.splitter_type=splitter;return ep}),p=m.getLatLng();draft={source:sources[0],sources,points:[[p.lng,p.lat]],trunk:Boolean(selected&&selected.isTrunk)};mode='route';closePanel();document.getElementById('cancel').style.display='inline-block';document.getElementById('undo').style.display='inline-block';hint(`${sources.length} interface${sources.length===1?'':'s'} selecionada${sources.length===1?'':'s'}${draft.trunk?' · Eth-Trunk com LAGs':''}. Clique no destino ou marque pontos nas ruas.`);drawPreview()}
async function openHostPanel(m){let d=m.net,passive=d.kind==='cto'||d.kind==='cloud',type=d.kind==='cloud'?'Operadora / Nuvem':d.kind==='cto'?'CTO':d.role||(d.kind==='host'?'Host planejado':'Elemento'),meta=`${esc(type)} · ${d.down?'Indisponível':d.planned?'Planejado':'Monitorado'}`;showPanel(`<h2>${esc(d.name)}</h2><div class="panel-meta">${meta}<br>${d.ips?'IP: '+esc(d.ips):''}</div><p>Carregando interfaces…</p>`);if(passive){showPanel(`<h2>${esc(d.name)}</h2><div class="panel-meta">${esc(type)}</div><button id="passiveLink" class="panel-action">Criar enlace a partir deste elemento</button>`);document.getElementById('passiveLink').onclick=()=>beginLink(m,null);return}if(!d.zabbix_hostid){showPanel(`<h2>${esc(d.name)}</h2><div class="panel-meta">${meta}</div><p>Este host é local/planejado e ainda não está associado ao NetBox/Zabbix.</p>`);return}try{let xs=await api(`/api/interfaces/${d.zabbix_hostid}`);showPanel(`<h2>${esc(d.name)}</h2><div class="panel-meta">${meta}<br>Clique numa interface para consultar e criar enlace.</div><div id="panelIfaces">${xs.map((x,i)=>`<div class="panel-iface" data-i="${i}"><b class="${x.status==='up'?'updot':x.status==='down'?'downdot':'unkdot'}">●</b> ${esc(x.name)}<br><small>${esc(x.description||'Sem descrição')} · ${esc(statusText(x.status))}</small><div class="iface-details" hidden>${interfaceMetrics(x)}<button class="panel-action start-iface">Criar enlace pela ${esc(x.name)}</button></div></div>`).join('')||'<p>Nenhuma interface encontrada.</p>'}</div>`);document.querySelectorAll('.panel-iface').forEach(el=>el.onclick=e=>{if(e.target.closest('.start-iface'))return;document.querySelectorAll('.panel-iface').forEach(x=>{x.classList.remove('selected');let detail=x.querySelector('.iface-details');if(detail)detail.hidden=true});el.classList.add('selected');el.querySelector('.iface-details').hidden=false});document.querySelectorAll('.start-iface').forEach((b,i)=>b.onclick=e=>{e.stopPropagation();chooseSourceInterfaces(m,xs,i)})}catch(e){showPanel(`<h2>${esc(d.name)}</h2><p>Falha ao consultar interfaces: ${esc(e.message)}</p>`)}}
async function chooseMarker(m){try{if(mode==='route'||mode==='target')await finishTarget(m)}catch(e){alert(e.message);cancel()}}
function drawPreview(cursor){if(preview)map.removeLayer(preview);if(!draft)return;let pts=draft.points.map(p=>[p[1],p[0]]);if(cursor)pts.push(cursor);preview=L.polyline(pts,{color:'#38bdf8',weight:4,dashArray:'6 5'}).addTo(map)}
function undoPoint(){if(!draft||!['route','target'].includes(mode))return;if(draft.points.length>1)draft.points.pop();mode='route';hint(draft.points.length>1?'Último ponto removido. Continue o trajeto ou clique no destino.':'Trajeto limpo. Clique direto no destino ou marque um ponto na rua.');drawPreview()}
async function createElementAt(kind,latlng){let label=kind==='cto'?'CTO':'host',name=prompt(`Nome do ${label}:`);if(!name)return;await api('/api/nodes',{method:'POST',body:JSON.stringify({name,kind,latitude:latlng.lat,longitude:latlng.lng})});await loadNodes();map.setView(latlng,15)}
function chooseElementAt(latlng){modal('Adicionar elemento',`<button id="addHostHere" class="iface"><b>Host</b><br><small>Elemento local/planejado</small></button><button id="addCtoHere" class="iface"><b>CTO</b><br><small>Caixa de terminação óptica</small></button>`);document.getElementById('addHostHere').onclick=()=>{closeModal();createElementAt('host',latlng)};document.getElementById('addCtoHere').onclick=()=>{closeModal();createElementAt('cto',latlng)}}
map.on('contextmenu',e=>{if(mode)return;let coords=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`,p=L.popup({closeButton:true}).setLatLng(e.latlng).setContent(`<div class="link-menu"><small>Coordenadas</small><b>${coords}</b><button id="addElementHere">＋ Adicionar elemento aqui</button></div>`).openOn(map);setTimeout(()=>{let b=document.getElementById('addElementHere');if(b)b.onclick=()=>{map.closePopup(p);chooseElementAt(e.latlng)}},0)});
map.on('mousemove',e=>{if(mode==='route')drawPreview(e.latlng)});map.on('click',async e=>{if(mode==='cto'){let name=prompt('Nome da CTO:');if(name){await api('/api/nodes',{method:'POST',body:JSON.stringify({name,kind:'cto',latitude:e.latlng.lat,longitude:e.latlng.lng})});await loadNodes();map.setView(e.latlng,15)}cancel();return}if(mode==='route'){draft.points.push([e.latlng.lng,e.latlng.lat]);mode='target';hint('Clique no host/CTO de destino, ou clique no mapa para continuar o trajeto.');drawPreview()}else if(mode==='target'){draft.points.push([e.latlng.lng,e.latlng.lat]);mode='route';hint('Continue marcando a rota ou clique no destino.');drawPreview()}});
async function finishTarget(m){let target=await selectInterface(m.net,'de destino'),p=m.getLatLng();draft.points.push([p.lng,p.lat]);let name=prompt('Nome do enlace:',`${draft.source.name} → ${target.name}`);if(!name){cancel();return}let parents=links.filter(l=>l.target_kind===draft.source.kind&&Number(l.target_id)===Number(draft.source.id));let parent=parents.length===1?parents[0].id:null;await api('/api/links',{method:'POST',body:JSON.stringify({name,source:draft.source,target,parent_link_id:parent,coordinates:draft.points})});cancel();await loadLinks()}
function cancel(){if(movingMarker){movingMarker.setLatLng(movingMarker.anchor);movingMarker.dragging.disable();movingMarker=null}mode=null;draft=null;if(preview)map.removeLayer(preview);preview=null;hint('');document.getElementById('cancel').style.display='none';document.getElementById('undo').style.display='none';closeModal()}
document.getElementById('newCto').onclick=()=>{cancel();mode='cto';hint('Clique no mapa onde a CTO está instalada.');document.getElementById('cancel').style.display='inline-block'};document.getElementById('undo').onclick=undoPoint;document.getElementById('cancel').onclick=cancel;document.getElementById('panelClose').onclick=closePanel;
document.addEventListener('keydown',e=>{if((e.key==='Backspace'||(e.ctrlKey&&e.key.toLowerCase()==='z'))&&['route','target'].includes(mode)){e.preventDefault();undoPoint()}else if(e.key==='Escape'&&mode)cancel()});
function refreshMarkers(){let far=map.getZoom()<=11;for(let m of markers.values()){let hide=far&&m.net.kind==='device';if(hide){if(map.hasLayer(m))map.removeLayer(m)}else{m.setIcon(mkIcon(m.net));if(!map.hasLayer(m))m.addTo(map)}}siteMarkers.forEach(m=>{if(far){if(!map.hasLayer(m))m.addTo(map)}else if(map.hasLayer(m))map.removeLayer(m)})}
async function loadTopology(){let data=await api('/api/topology'),bounds=[],count=0;data.sites.forEach(s=>{bounds.push([s.latitude,s.longitude]);s.devices.forEach((d,i)=>{count++;d.kind='device';d.down=d.zabbix_hostid&&Number(d.availability)===2;d.planned=d.netbox_status==='planned';let p=d.latitude!=null?[d.latitude,d.longitude]:offset(s.latitude,s.longitude,i,s.devices.length);addMarker(d,p)});let icon=L.divIcon({className:'',iconSize:[25,25],iconAnchor:[12,12],html:`<div class="site-cluster">${s.devices.length}</div>`}),sm=L.marker([s.latitude,s.longitude],{icon,title:s.name});sm.on('click',()=>map.setView([s.latitude,s.longitude],14));siteMarkers.push(sm)});if(bounds.length)map.fitBounds(bounds,{padding:[50,50]});document.getElementById('summary').textContent=`${data.sites.length} centrais · ${count} equipamentos`;await loadNodes();refreshMarkers()}
async function loadNodes(){for(let[k,m]of markers)if(k.startsWith('cto:')||k.startsWith('host:')||k.startsWith('junction:')){map.removeLayer(m);markers.delete(k)}let ns=await api('/api/nodes');ns.forEach(n=>addMarker(n,[n.latitude,n.longitude]));refreshMarkers()}
map.on('zoomend',refreshMarkers);
function lineColor(s){return s==='down'?'#ef4444':s==='up'?'#22c55e':'#f59e0b'}
function openLinkPanel(l,layer){showPanel(`<h2>${esc(l.name)}</h2><div class="panel-meta">${esc(l.source_name)} (${esc(l.source_interface_name||'sem porta')}) → ${esc(l.target_name)} (${esc(l.target_interface_name||'sem porta')})<br>Status: ${esc(l.status)}</div><button id="editLink" class="panel-action">Editar trajeto</button><button id="deleteLink" class="panel-action danger">Excluir enlace</button><div id="linkEditActions"></div>`);document.getElementById('editLink').onclick=()=>{layer.editing.enable();document.getElementById('linkEditActions').innerHTML='<button id="saveLink" class="panel-action">Salvar novo trajeto</button><button id="cancelLinkEdit" class="panel-action">Cancelar edição</button>';document.getElementById('saveLink').onclick=async()=>{await api(`/api/links/${l.id}`,{method:'PUT',body:JSON.stringify({coordinates:layer.getLatLngs().map(p=>[p.lng,p.lat])})});layer.editing.disable();closePanel();await loadLinks()};document.getElementById('cancelLinkEdit').onclick=()=>{layer.editing.disable();closePanel();loadLinks()}};document.getElementById('deleteLink').onclick=async()=>{if(confirm(`Excluir o enlace "${l.name}"?`)){await api(`/api/links/${l.id}`,{method:'DELETE'});closePanel();await loadLinks()}}}
async function loadLinks(){links=await api('/api/links');editable.clearLayers();links.forEach(l=>{let layer=L.polyline(l.geometry.coordinates.map(p=>[p[1],p[0]]),{color:lineColor(l.status),weight:5});layer.linkId=l.id;layer.on('click',e=>{L.DomEvent.stopPropagation(e);openLinkPanel(l,layer)});editable.addLayer(layer)})}
map.on(L.Draw.Event.EDITED,e=>e.layers.eachLayer(l=>api(`/api/links/${l.linkId}`,{method:'PUT',body:JSON.stringify({coordinates:l.getLatLngs().map(p=>[p.lng,p.lat])})}).catch(x=>alert(x.message))));map.on(L.Draw.Event.DELETED,e=>e.layers.eachLayer(l=>api(`/api/links/${l.linkId}`,{method:'DELETE'}).catch(x=>alert(x.message))));
let legend=L.control({position:'bottomright'});legend.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<span class="line-swatch" style="border-color:#22c55e"></span>Ativo<br><span class="line-swatch" style="border-color:#ef4444"></span>Inativo/herdado<br><span class="line-swatch" style="border-color:#f59e0b"></span>Sem status';return d};legend.addTo(map);
</script><script src="/static/workflows.js?v=20260929a"></script><script src="/static/portal.js?v=20260929a"></script><script>
startNetAtlas().catch(e=>{document.getElementById('summary').textContent='Erro';hint(e.message)});
</script></body></html>
